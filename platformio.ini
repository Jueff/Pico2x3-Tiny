[platformio]
src_dir = src
    
[env]
framework = arduino
build_src_flags = 

[env:Pico2x3-Tiny]
extra_scripts = pre:copy_firmware.py
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = pico
board_build.core = earlephilhower
build_flags = -DAPP_VERSION=0.1 
lib_deps =
    ;WS281xProcessor      @=1.0.0
    WS281xProcessor       =file://../../../libraries/WS281xProcessor@1.0.1
    MobaLedLib            =https://github.com/Hardi-St/MobaLedLib#longInpAddresses
    ;PicoFlashStorage     @=1.0.1
    PicoFlashStorage  =file://../../../libraries/PicoFlashStorage@1.0.2
    MLLServoConfigurator  =file://../../../libraries/MLLServoConfigurator@0.3.0
    ;MLLSoundTiny         @=0.1.0
    MLLSoundTiny          =file://../../../libraries/MLLSoundTiny@0.1.0
    SoftwareSerialTx     @=0.1.0
    RP2040_PWM           @=1.7.0
    AceButton            @=1.9.2 